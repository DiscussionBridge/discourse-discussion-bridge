name: Discourse Plugin

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adapter-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout plugin
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Verify release identity
        run: ruby script/verify_release_identity.rb
      - name: Checkout released Adapter Protocol
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: DiscussionBridge/discussionbridge-adapter-contract
          ref: v0.2.0-alpha.21
          path: .adapter-contract
      - name: Verify exact request boundary
        run: >-
          ruby script/verify_adapter_contract.rb
          .adapter-contract/contract.json
          .adapter-contract/operator-service-contract.json

  ci:
    uses: discourse/.github/.github/workflows/discourse-plugin.yml@bee9ee78c8e6fd574a8496f415e08c6eb412d3df
    with:
      core_ref: 36698aae084678151dffa875d49c8d59216d2733
