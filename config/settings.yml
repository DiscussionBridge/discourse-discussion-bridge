plugins:
  discussion_bridge_enabled:
    default: false
    client: true
  discussion_bridge_endpoint_enabled:
    default: false
    client: false
  discussion_bridge_service_username:
    default: ""
    type: username
    client: false
    validator: "DiscussionBridge::ServiceUsernameValidator"
  discussion_bridge_default_author_username:
    default: ""
    type: username
    client: false
    validator: "DiscussionBridge::ServiceUsernameValidator"
  discussion_bridge_effective_category_id:
    type: integer
    default: 0
    client: false
    validator: "DiscussionBridge::CategoryValidator"
  discussion_bridge_effective_tags:
    type: list
    list_type: simple
    default: ""
    client: false
    validator: "DiscussionBridge::TagsValidator"
  discussion_bridge_lane_policies:
    type: text
    default: "[]"
    client: false
    validator: "DiscussionBridge::LanePoliciesValidator"
  discussion_bridge_default_visibility:
    type: enum
    default: "unlisted"
    choices:
      - unlisted
    client: false
  discussion_bridge_comments_only_full_interactive:
    default: false
    client: false
  discussion_bridge_publisher_enabled:
    default: false
    client: true
  discussion_bridge_publication_status_audience:
    type: enum
    default: "staff"
    choices:
      - admins
      - staff
      - groups
    client: false
  discussion_bridge_publication_status_groups:
    type: group_list
    list_type: compact
    default: ""
    allow_any: false
    client: false
    refresh: true
    area: "group_permissions"
  discussion_bridge_attention_groups:
    type: group_list
    list_type: compact
    default: "1|2"
    allow_any: false
    client: false
    refresh: true
    area: "group_permissions"
